<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kente Kickers — Build your club, win the league</title>
<meta name="description" content="Kente Kickers: an original free football game. Build your own club, manage your squad and play real-time matches on your phone. Works offline.">
<meta name="theme-color" content="#0d2b14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar" class="hidden">
    <div class="tb-team"><span id="tb-crest"></span><div><b id="tb-name"></b><small id="tb-div"></small></div></div>
    <div class="tb-right"><span class="coins" id="tb-coins">0</span><button id="tb-mute" class="icon-btn" aria-label="Sound on/off">🔊</button></div>
  </header>
  <main id="screen"></main>
  <nav id="bottomnav" class="hidden">
    <button data-go="hub">🏠<span>Home</span></button>
    <button data-go="squad">👕<span>Squad</span></button>
    <button data-go="market">💱<span>Transfers</span></button>
    <button data-go="league">📊<span>League</span></button>
    <button data-go="cups">🏆<span>Cups</span></button>
    <button data-go="club">🏟️<span>Club</span></button>
  </nav>
</div>

<div id="match" class="hidden">
  <canvas id="pitch3d" class="hidden"></canvas>
  <canvas id="pitch"></canvas>
  <div id="hud">
    <button id="m-pause" class="hud-btn" aria-label="Pause">⏸</button>
    <div id="scorebar"><span id="h-crest"></span><b id="h-name">HOM</b><span id="h-score">0 - 0</span><b id="a-name">AWY</b><span id="a-crest"></span><span id="h-time">0'</span></div>
    <button id="m-mute" class="hud-btn" aria-label="Sound">🔊</button>
  </div>
  <div id="joyzone"><div id="joybase"><div id="joyknob"></div></div><div id="joyhint">Drag here to move</div></div>
  <div id="btnzone">
    <button id="b-tackle" class="act small">TACKLE<br><small>/ sprint</small></button>
    <button id="b-pass" class="act mid">PASS</button>
    <button id="b-shoot" class="act big">SHOOT</button>
  </div>
  <div id="m-overlay" class="hidden"></div>
</div>

<div id="modal" class="hidden"><div class="modal-card" id="modal-card"></div></div>
<div id="toast" class="hidden"></div>

<script src="js/data.js"></script>
<script src="js/europe.js"></script>
<script src="js/audio.js"></script>
<script src="js/match.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
